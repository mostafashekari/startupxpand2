name: Legacy v4.1.5 build — disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-notice:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain disabled legacy build
        run: |
          echo 'This workflow produced the obsolete v4.1.5 package and is intentionally disabled.'
          echo 'The approved current release is v4.2.0 (versionCode 40200).'
          echo 'See RELEASE-v4.2.0.md and docs/SECURE-DEVELOPER-CONTINUITY.md.'
          exit 1
